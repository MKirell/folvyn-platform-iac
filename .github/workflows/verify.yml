name: verify

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    paths: ['terraform/**']
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --no-banner --exit-code=1

  dev:
    uses: ./.github/workflows/plan.yml
    with:
      environment: dev
      apply: false
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  prod:
    uses: ./.github/workflows/plan.yml
    with:
      environment: prod
      apply: false
    permissions:
      contents: read
      id-token: write
    secrets: inherit
